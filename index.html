<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#82b7b5"><title>Моё расписание</title><link rel="manifest" href="./manifest.json"><style>body{margin:0;background:#82b7b5;color:#292b1c;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.load{background:#f8f1e6;padding:24px 28px;border-radius:24px;max-width:300px;text-align:center}b{font-size:22px}</style></head>
<body><div class="load"><b>Моё расписание</b><p id="status">Загружаю приложение…</p></div>
<script>
(async()=>{
 try{
  const response=await fetch("./app.html.gz");
  if(!response.ok)throw new Error("Не удалось загрузить приложение ("+response.status+")");
  if(!("DecompressionStream" in window))throw new Error("Браузер не поддерживает загрузку приложения. Обновите браузер.");
  const stream=response.body.pipeThrough(new DecompressionStream("gzip"));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(error){document.getElementById("status").textContent=error.message+" Перезагрузите страницу."}
})();
</script></body></html>
